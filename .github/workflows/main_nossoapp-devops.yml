# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - nossoapp-devops

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: nossoappregistry.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_BEA46384064942D1A17604C3BA36C08F }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_9B61805DD0FF41C0ACDFC00E80DA9CCF }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: nossoappregistry.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_BEA46384064942D1A17604C3BA36C08F }}/nossoapp:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8C952C886BA442CAA043EE1357C4753C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5C4FABB44FB040EBBBF0645E60BB3CF2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B7B52E3B2F3F464C8168F9BD4C8C386A }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'nossoapp-devops'
          slot-name: 'Production'
          images: 'nossoappregistry.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_BEA46384064942D1A17604C3BA36C08F }}/nossoapp:${{ github.sha }}'
          